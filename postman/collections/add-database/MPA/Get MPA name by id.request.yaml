$kind: http-request
url: "{{baseUrl}}/mpa/{{id}}"
method: GET
headers:
  Accept: "*/*"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.be.ok;\r

      });\r

      pm.test(\"Get MPA response\", function () {\r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      const source = pm.collectionVariables.get(\"source\");\r

      \r

      const MPAS_US = {\r

      \    1: \"G\",\r

      \    2: \"PG\",\r

      \    3: \"PG-13\",\r

      \    4: \"R\",\r

      \    5: \"NC-17\"\r

      };\r

      \r

      const MPAS_RU = {\r

      \    1: \"0+\",\r

      \    2: \"6+\",\r

      \    3: \"12+\",\r

      \    4: \"16+\",\r

      \    5: \"18+\"\r

      };\r

      \r

      pm.test(\"Test MPA 'id' and 'name' fields (US or RU system)\", function () {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json).to.have.property('id');\r

      \    pm.expect(json).to.have.property('name');\r

      \r

      \    pm.expect(json.id, `\"id\" must be ${source}`).to.eql(source);\r

      \r

      \    const usMatch = MPAS_US[source] && json.name === MPAS_US[source];\r

      \    const ruMatch = MPAS_RU[source] && json.name === MPAS_RU[source];\r

      \r

      \    pm.expect(\r

      \        usMatch || ruMatch,\r

      \        `\"name\" must be \"${MPAS_US[source]}\" (US) or \"${MPAS_RU[source]}\" (RU)`\r

      \    ).to.be.true;\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: "const mpa = Math.floor(Math.random() * (5 - 1 + 1) + 1);\r

      pm.collectionVariables.set(\"id\", mpa);\r

      pm.collectionVariables.set(\"source\", mpa)"
    language: text/javascript
examples: ./.resources/Get MPA name by id.resources/examples
order: 1000
