$kind: http-request
url: "{{baseUrl}}/films"
method: POST
headers:
  Content-Type: application/json
  Accept: "*/*"
body:
  type: json
  content: |-
    {
      "name": "Film name",
      "description": "Пятеро друзей ( комик-группа «Шарло»), приезжают в город Бризуль. Здесь они хотят разыскать господина Огюста Куглова, который задолжал им деньги, а именно 20 миллионов. о Куглов, который за время «своего отсутствия», стал кандидатом Коломбани.",
        "releaseDate": "1900-03-25",
      "duration": 200,
      "mpa": { "id": 1}
    }
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 400\", function () {\r

      \     pm.expect(pm.response.code).to.be.equal(400);\r

      });\r

      pm.test(\"Has error response\", function () {\r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      });\r\n"
    language: text/javascript
order: 4000
